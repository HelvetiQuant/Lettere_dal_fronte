# archive_providers.yml — Registry versionato dei provider di fonti storiche
# Versione: 1.0.0
# Data: 2026-07-26
#
# Ogni provider dichiara:
# - code: identificatore univoco
# - display_name: nome visualizzato
# - base_url: URL principale
# - api_endpoints: endpoint specifici (search, metadata, download, iiif)
# - authorized_domains: domini autorizzati per scraping/fetch
# - capabilities: search, get_metadata, get_document, iiif, full_text
# - access_mode: auto | assisted | manual
# - rights_default: METADATA_ONLY | PUBLIC_VIEW | PUBLIC_DOWNLOAD | REQUEST_REQUIRED
# - authority_score: 0.0–1.0 (affidabilità storica)
# - historical_periods: WWI, WWII, interwar, postwar
# - geographic_areas: aree geografiche coperte
# - entity_types: person, event, place, unit, document
# - languages: lingue dei contenuti
# - contract_version: versione del contratto API
# - config: parametri specifici (api_key_env, rate_limit, etc.)

version: "1.0.0"

providers:
