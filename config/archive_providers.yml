    access_mode: assisted
    rights_default: METADATA_ONLY
    authority_score: 0.95
    historical_periods: [WWI, WWII, interwar, postwar]
    geographic_areas: [Italy]
    entity_types: [event, unit, document, place]
    languages: [it]
    contract_version: "1.0"
    config:
      rate_limit_delay: 3
      notes: "Scraping HTML, no API ufficiale. Contattare per accesso archivio digitale."

